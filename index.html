<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог наборов и схем</title>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <!-- Шапка -->
  <header class="bg-white shadow-xs py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">MiniStitch Catalog</h1>
      <span class="text-sm text-gray-500">Авторские схемы</span>
    </div>
  </header>

  <!-- Основной каталог -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Карточки товаров будут рендериться здесь через JS -->
    </div>
  </main>

  <!-- Фиксированная плашка корзины внизу (как на сайте-примере) -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl translate-y-full transition-transform duration-300">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div>
        <span class="font-medium">Выбрано товаров: <span id="cart-count">0</span></span>
        <div id="discount-alert" class="text-xs text-green-600 hidden">Применена скидка 10%!</div>
      </div>
      <button id="save-order-btn" class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition-colors">
        Сохранить заказ
      </button>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
